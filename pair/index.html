<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ربط واتساب | Fares</title><style>body{font-family:system-ui;background:#101827;color:#fff;max-width:620px;margin:8vh auto;padding:24px}main{background:#182338;padding:28px;border-radius:18px}input,button{width:100%;padding:14px;margin-top:12px;border-radius:10px;border:0;font-size:16px}button{background:#21c77a;color:#07140d;font-weight:700;cursor:pointer}#out{margin-top:20px;font-size:24px;text-align:center;letter-spacing:3px}</style><main><h1>🔗 ربط رقم واتساب</h1><p>أدخل الرقم بالصيغة الدولية بدون + ثم أدخل الكود في واتساب ← الأجهزة المرتبطة.</p><form id=f><input id=n inputmode=numeric placeholder="9677XXXXXXXX" required><button>إصدار كود الاقتران</button></form><div id=out></div><script>f.onsubmit=async e=>{e.preventDefault();out.textContent='جاري الاتصال...';let r=await fetch('/api/public/pairing-code',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({number:n.value,accepted:true})});let d=await r.json();out.textContent=d.ok?d.code:(d.error||'تعذر الإصدار')}</script></main></html>

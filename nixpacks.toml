# إعدادات بناء Railway — مُحدَّثة لحل مشكلة npm SIGTERM في postinstall
[variables]
    # تعطيل سكربتات postinstall لتفادي node-gyp/scrypt على Baileys
    # (كل ما يحتاجه المشروع متوفر ك wasm/js خالص)
    NPM_CONFIG_IGNORE_SCRIPTS = "true"
    NPM_CONFIG_FUND = "false"
    NPM_CONFIG_AUDIT = "false"
    NPM_CONFIG_UPDATE_NOTIFIER = "false"
    NODE_OPTIONS = "--max-old-space-size=1536"

[phases.install]
    cmds = [
        "npm ci --no-audit --no-fund --prefer-offline || npm install --no-audit --no-fund --legacy-peer-deps",
    ]

[phases.build]
    cmds = ["echo 'no build step required'"]

[start]
    cmd = "node index.js"
